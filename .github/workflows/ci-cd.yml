name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (lint, migrate, test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: safestart_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Throwaway database inside the CI runner; not a real credential.
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/safestart_test?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - name: Apply migrations
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
      - run: npm run lint
      - run: npm test

  frontend:
    name: Frontend (lint, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  deploy:
    name: Deploy to Render
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      # Render services use autoDeploy: false (render.yaml), so they only
      # deploy here, after CI has passed. Until the deploy hook secrets exist
      # the job reports that and succeeds, so CI stays green.
      - name: Trigger Render deploys
        env:
          API_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_API }}
          WEB_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_WEB }}
        run: |
          if [ -z "$API_HOOK" ] && [ -z "$WEB_HOOK" ]; then
            echo "::notice::Render deploy hooks are not configured; skipping deploy. Add RENDER_DEPLOY_HOOK_API and RENDER_DEPLOY_HOOK_WEB secrets."
            exit 0
          fi
          for name in API WEB; do
            hook_var="${name}_HOOK"
            hook="${!hook_var}"
            if [ -z "$hook" ]; then
              echo "::warning::RENDER_DEPLOY_HOOK_${name} is not set; skipping that service."
              continue
            fi
            curl --fail --silent --show-error -X POST "$hook" > /dev/null
            echo "Triggered ${name} deploy."
          done
